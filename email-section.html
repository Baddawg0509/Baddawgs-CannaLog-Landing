<!-- ============================================================
     SECTION — GET NOTIFIED
     ============================================================ -->
<section class="section" id="email">
  <div class="container">
    <div class="email-capture">
      <p class="eyebrow">Stay Updated</p>
      <h2 class="email-capture__title">Get notified at launch</h2>
      <p class="email-capture__subtitle">Be the first to know when Baddawg Grow hits the Play Store. No spam, ever.</p>

      <form id="email-form" class="email-form" onsubmit="return handleSubmit(event)">
        <input type="email" id="email-input" class="email-form__input" placeholder="your@email.com" required>
        <button type="submit" class="btn btn--primary">Notify Me</button>
      </form>

      <p id="form-message" class="email-form__message" style="display:none;"></p>
    </div>
  </div>
</section>

<script>
function handleSubmit(event) {
  event.preventDefault();
  var email = document.getElementById('email-input').value.trim();
  if (!email) return false;

  // Store in localStorage (simple, no external service)
  var emails = JSON.parse(localStorage.getItem('baddawg_subscribers') || '[]');
  if (emails.includes(email)) {
    showMessage("You're already on the list! 🎉");
    return false;
  }
  emails.push(email);
  localStorage.setItem('baddawg_subscribers', JSON.stringify(emails));

  // Also try to store via GitHub Issues API (best effort, no auth needed for public repos)
  // This creates an issue in the landing page repo with the email
  fetch('https://api.github.com/repos/Baddawg0509/Baddawgs-CannaLog-Landing/issues', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: 'Launch notification: ' + email,
      body: 'Email: ' + email + '\nSource: Landing page\nDate: ' + new Date().toISOString(),
      labels: ['launch-notification']
    })
  }).catch(function() {}); // Silently fail if API fails

  showMessage("Thanks! We'll notify you at launch. 🌱");
  document.getElementById('email-input').value = '';
  return false;
}

function showMessage(text) {
  var msg = document.getElementById('form-message');
  msg.textContent = text;
  msg.style.display = 'block';
  setTimeout(function() { msg.style.display = 'none'; }, 5000);
}
</script>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00cc52"/>
    </linearGradient>
    <!-- Body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bodyGrad)" stroke="#00ff66" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Dawg silhouette - sitting profile facing right -->
  <!-- Body -->
  <ellipse cx="185" cy="240" rx="75" ry="55" fill="#161925"/>
  <!-- Back legs -->
  <rect x="130" y="275" width="22" height="45" rx="8" fill="#161925"/>
  <rect x="162" y="278" width="20" height="42" rx="7" fill="#161925"/>
  <!-- Tail - curves up into a cannabis leaf shape -->
  <path d="M 115 230 Q 95 200 85 175 Q 80 160 90 155 Q 100 165 105 180 Q 108 170 115 165 Q 118 178 112 190 Q 120 185 128 188 Q 122 200 118 215 Z" fill="url(#leafGrad)" filter="url(#leafGlow)"/>
  <!-- Head -->
  <ellipse cx="230" cy="195" rx="42" ry="38" fill="#161925"/>
  <!-- Snout -->
  <ellipse cx="265" cy="208" rx="28" ry="18" fill="#161925"/>
  <!-- Nose -->
  <circle cx="288" cy="205" r="6" fill="#00ff66"/>
  <!-- Eye -->
  <circle cx="240" cy="185" r="5" fill="#00ff66" filter="url(#leafGlow)"/>
  <!-- Ear - large floppy ear that forms a second leaf shape -->
  <path d="M 215 165 Q 200 140 185 120 Q 178 112 182 105 Q 192 110 200 125 Q 195 110 198 98 Q 208 108 210 125 Q 215 110 225 108 Q 225 122 220 138 Q 230 130 240 135 Q 232 150 222 165 Z" fill="url(#leafGrad)" filter="url(#leafGlow)"/>
  <!-- Front leg -->
  <rect x="200" y="280" width="18" height="38" rx="7" fill="#161925"/>
  <!-- Paw detail -->
  <ellipse cx="141" cy="322" rx="13" ry="8" fill="#161925"/>
  <ellipse cx="172" cy="322" rx="12" ry="7" fill="#161925"/>
  <ellipse cx="209" cy="320" rx="11" ry="7" fill="#161925"/>

  <!-- Collar accent -->
  <rect x="195" y="228" width="50" height="6" rx="3" fill="#00ff66" filter="url(#leafGlow)"/>
  <circle cx="220" cy="238" r="4" fill="#00ff66"/>

  <!-- Brand text -->
  <text x="200" y="365" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#e6f7ff" letter-spacing="6">BADDAWG</text>
  <text x="200" y="388" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#00ff66" letter-spacing="4">GROW</text>
</svg>
